# Tripppin compositor: invisible. One full-screen terminal running `trip home`;
# every other window opens full screen on top. No bars, borders or titles.
# Local overrides go in /etc/tripppin/sway.d/*.conf (included at the end).

default_border none
default_floating_border none
hide_edge_borders both
titlebar_border_thickness 0
titlebar_padding 0
gaps inner 0
gaps outer 0
focus_follows_mouse no
mouse_warping none
focus_wrapping yes
popup_during_fullscreen smart
xwayland disable
seat * hide_cursor when-typing enable
output * bg #0a0d0c solid_color

input type:keyboard {
    xkb_layout us
    repeat_delay 250
    repeat_rate 40
}
input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
    accel_profile adaptive
}

# Every window is full screen, always.
for_window [app_id=".*"] fullscreen enable
for_window [class=".*"] fullscreen enable
for_window [title=".*"] fullscreen enable

# Super+Tab cycles apps, Super+Esc goes home, Super+Q closes an app (never home).
# (A full-screen window blocks focus changes, so drop full screen, move, and restore it.)
bindsym Mod4+Tab fullscreen disable, focus next, fullscreen enable
bindsym Mod4+Shift+Tab fullscreen disable, focus prev, fullscreen enable
bindsym Mod4+Escape fullscreen disable, [app_id="^trip-home$"] focus, fullscreen enable
bindsym Mod4+q [focused app_id="^(?!trip-home$).*"] kill
bindsym Mod4+Shift+r reload

# Hardware keys.
bindsym --locked XF86MonBrightnessUp exec brightnessctl -q set 5%+
bindsym --locked XF86MonBrightnessDown exec brightnessctl -q set 5%-
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Audio stack and the home terminal.
exec /usr/libexec/tripppin/audio
exec foot --app-id trip-home -c /etc/tripppin/foot.ini -- /usr/libexec/tripppin/home

include /etc/tripppin/sway.d/*.conf
