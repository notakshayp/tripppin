# Tripppin terminal: Wayland-native, truecolor, sixel, mouse reporting.
font=JetBrains Mono:size=11
font-bold=JetBrains Mono:weight=bold:size=11
pad=10x6
term=foot
bold-text-in-bright=no
dpi-aware=no

[scrollback]
lines=2000

[cursor]
style=beam
blink=no

[mouse]
hide-when-typing=yes

[bell]
urgent=no
notify=no

[colors-dark]
alpha=1.0
background=0a0d0c
foreground=cfd8d3
regular0=1a201e
regular1=e06c5a
regular2=46c37b
regular3=e5b45a
regular4=6cb6e8
regular5=c58ce0
regular6=5fd0c4
regular7=cfd8d3
bright0=4a5753
bright1=ec8878
bright2=6bd999
bright3=efc77c
bright4=92c9ee
bright5=d4a8e8
bright6=85e0d6
bright7=eef4f0
selection-foreground=0a0d0c
selection-background=46c37b
