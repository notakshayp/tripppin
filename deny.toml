# cargo-deny: run in CI on every PR. Fails on known vulnerabilities, yanked
# crates, licenses we can't ship under Apache-2.0, and crates from unknown sources.

[advisories]
# Every RustSec advisory fails the build unless listed here with a reason.
ignore = []
yanked = "deny"

[licenses]
# CDLA-Permissive-2.0 covers webpki-roots (Mozilla's CA list as data); we trust the OS store instead,
# but the crate is still compiled in.
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
