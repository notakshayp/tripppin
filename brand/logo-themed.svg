<svg xmlns="http://www.w3.org/2000/svg" viewBox="27 12 146 175" width="146" height="175" role="img" aria-label="Tripppin">
<title>Tripppin</title>
<style>
  .ink{fill:#182423;stroke:#182423} .green{fill:#1f6b45}
  @media (prefers-color-scheme: dark){ .ink{fill:#f2f5ef;stroke:#f2f5ef} .green{fill:#57d99a} }
  .arc{fill:none;stroke-width:22;stroke-linecap:round;}
  .spark{transform-box:fill-box;transform-origin:center;}
  .sp{transform-box:fill-box;transform-origin:center;opacity:0;}
  .s0{--x:16px;--y:-16px} .s1{--x:16px;--y:16px} .s2{--x:-16px;--y:16px} .s3{--x:-16px;--y:-16px}
  @keyframes draw{0%{stroke-dashoffset:1}18%,100%{stroke-dashoffset:0}}
  @keyframes pop{0%,16%{transform:scale(0) rotate(-135deg)}26%{transform:scale(1.18) rotate(-10deg)}32%,100%{transform:none}}
  @keyframes burst{0%,28%{opacity:0;transform:none}31%{opacity:1;transform:none}44%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){ .arc,.spark,.sp{animation:none} .arc{stroke-dashoffset:0} }
</style>
<path class="arc ink" pathLength="1" d="M58.32 70.84 A60 60 0 1 0 141.68 70.84"/>
<path class="spark green" d="M100.00 14.00 106.11 43.89 136.00 50.00 106.11 56.11 100.00 86.00 93.89 56.11 64.00 50.00 93.89 43.89Z"/>
<g class="green"></g>
</svg>
