<svg xmlns="http://www.w3.org/2000/svg" viewBox="27 12 146 175" width="146" height="175" role="img" aria-label="Tripppin">
<title>Tripppin</title>
<style>
  .ink{fill:#182423;stroke:#182423} .green{fill:#1f6b45}
  @media (prefers-color-scheme: dark){ .ink{fill:#f2f5ef;stroke:#f2f5ef} .green{fill:#57d99a} }
  .arc{fill:none;stroke-width:22;stroke-linecap:round;stroke-dasharray:1;animation:draw 6s cubic-bezier(.3,0,.2,1) infinite}
  .spark{transform-box:fill-box;transform-origin:center;animation:spin 6s infinite}
  @keyframes draw{0%{stroke-dashoffset:1}9%,100%{stroke-dashoffset:0}}
  @keyframes spin{0%,7%{transform:scale(0) rotate(-180deg);animation-timing-function:cubic-bezier(.2,.7,.3,1)}
    15%{transform:scale(1.08) rotate(-20deg)}18%{transform:none}
    52%{transform:none;animation-timing-function:ease-in-out}62%,100%{transform:rotate(90deg)}}
  @media (prefers-reduced-motion: reduce){ .arc,.spark{animation:none} .arc{stroke-dashoffset:0} }
</style>
<path class="arc ink" pathLength="1" d="M52.72 77.06 A60 60 0 1 0 147.28 77.06"/>
<path class="spark green" d="M129.70 24.30 109.24 54.00 129.70 83.70 100.00 63.24 70.30 83.70 90.76 54.00 70.30 24.30 100.00 44.76Z"/>
</svg>
