[workspace]
resolver = "3"
members = ["crates/*"]
# tripppin-ui needs GTK 4 and gtk4-layer-shell, which only the Fedora build has;
# plain `cargo build` / `cargo test` skip it. CI builds it in a Fedora container.
default-members = ["crates/hwdetect", "crates/trip"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/notakshayp/tripppin"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
ureq = { version = "3", features = ["platform-verifier"] }
sha2 = "0.10"
reedline = "0.53"
ctrlc = "3"
crossterm = "=0.29.0"
nu-ansi-term = "=0.50.3"
unicode-width = "=0.2.3"
quick-xml = "0.37"
flate2 = "1"
hwdetect = { path = "crates/hwdetect" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
