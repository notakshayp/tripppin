# The text console. kmscon replaces the kernel console on tty1: it scrolls
# (mouse wheel, Shift+Up/Down, Shift+PageUp/PageDown), keeps 10,000 lines,
# lets you select text with the mouse, and draws in DM Mono with full colour.
# If it can't start, systemd falls back to the plain login prompt.
term=xterm-256color
sb-size=10000
mouse
font-engine=pango
font-name=DM Mono
font-size=18
