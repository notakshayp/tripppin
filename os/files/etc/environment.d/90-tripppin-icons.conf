# Flatpak apps export their icons (scalable SVG or 512 px) here; make sure Plasma's session
# searches them so third-party apps get their real icon, not a small fallback.
XDG_DATA_DIRS=${HOME}/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}
