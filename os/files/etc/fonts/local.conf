<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Inter for interface text, DM Mono for code, DejaVu Sans Mono to fill gaps. -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DM Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
