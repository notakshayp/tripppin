<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Manrope (Bento) for interface text, Inter as fallback, DM Mono for code, DejaVu Sans Mono to fill gaps. Text is
     greyscale-antialiased with slight hinting: crisp stems on ordinary screens, true shapes,
     and no colour fringes (subpixel order is unknown on rotated and external screens). -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
  <!-- Inter (and GNOME's Adwaita Sans) have a few symbols of their own in the private-use
       area, where the Lucide icon font keeps its icons: drop them from those fonts so icon
       characters always reach Lucide. -->
  <match target="scan">
    <test name="family"><string>Inter</string></test>
    <edit name="charset" mode="assign">
      <minus><name>charset</name><charset><range><int>0xe000</int><int>0xf8ff</int></range></charset></minus>
    </edit>
  </match>
  <match target="scan">
    <test name="family"><string>Inter Display</string></test>
    <edit name="charset" mode="assign">
      <minus><name>charset</name><charset><range><int>0xe000</int><int>0xf8ff</int></range></charset></minus>
    </edit>
  </match>
  <match target="scan">
    <test name="family"><string>Adwaita Sans</string></test>
    <edit name="charset" mode="assign">
      <minus><name>charset</name><charset><range><int>0xe000</int><int>0xf8ff</int></range></charset></minus>
    </edit>
  </match>
  <alias><family>sans-serif</family><prefer><family>Manrope</family><family>Inter</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DM Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
