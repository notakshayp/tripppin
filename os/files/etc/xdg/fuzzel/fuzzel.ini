# The launcher (Super+A, Super+D, or the logo in the bar): a quiet centred card: a search
# field and the apps, matches in bright text, the selection a faint neutral tint. The radius
# is the Default look; Settings → Appearance → Corners writes ~/.config/fuzzel/fuzzel.ini,
# which includes this file and changes only the radius.
[main]
font=Inter:size=12
prompt=""
placeholder=Search apps
icon-theme=Tripppin
# Search what an app says it is for too, so "wifi" finds the wi-fi settings.
fields=name,generic,keywords,comment,filename
icons-enabled=yes
width=34
lines=8
horizontal-pad=16
vertical-pad=14
inner-pad=10
line-height=34
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=111716fa
text=d9e1ddff
prompt=8a9a93ff
placeholder=6b7a74ff
input=f2f5efff
match=f2f5efff
selection=f2f5ef14
selection-text=f2f5efff
selection-match=f2f5efff
border=f2f5ef1a

[border]
width=1
radius=12
selection-radius=8
