# The launcher (Super+A, Super+D, or the logo in the bar): a centred ink card, Inter, green matches.
[main]
font=Inter:size=13
prompt="  "
icon-theme=Tripppin
# Search what an app says it is for too, so "wifi" finds the wi-fi settings.
fields=name,generic,keywords,comment,filename
icons-enabled=yes
width=38
lines=6
horizontal-pad=18
vertical-pad=12
inner-pad=12
line-height=26
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=141b19f7
text=d9e1ddff
prompt=8a9a93ff
placeholder=6b7a74ff
input=f2f5efff
match=57d99aff
selection=57d99a1f
selection-text=f2f5efff
selection-match=57d99aff
border=2f3d38ff

[border]
width=1
radius=22
