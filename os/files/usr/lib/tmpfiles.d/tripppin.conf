# Where downloaded models live. Administrators (wheel) can add models without sudo,
# so the first-boot screen can fetch one; the model service only reads them.
d /var/lib/tripppin 0755 root root -
d /var/lib/tripppin/models 2775 root wheel -
# Flatpak apps see the Tripppin GTK and Qt settings (a system-wide override).
d /var/lib/flatpak/overrides 0755 root root -
C /var/lib/flatpak/overrides/global 0644 root root - /usr/share/tripppin/flatpak/global
