# Model catalog: which model each hardware tier gets, and exactly which file.
#
# Tiers are checked top to bottom; the first one whose requirements the machine
# meets wins. Memory is in GiB as the kernel reports it, so a "16 GB" laptop
# shows about 15.3 GiB; thresholds sit a little under the marketing number.
#
# Files are Q4_K_M GGUF builds of the official Qwen3.5 weights by unsloth
# (Apache-2.0, same as the base models), pinned to a repository revision and
# checked by SHA-256 after download. Qwen does not publish GGUF files for 3.5;
# later we quantize the official weights ourselves and host the result.
# The catalog will be signed before it ships.

