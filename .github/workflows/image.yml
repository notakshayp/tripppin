name: image

on:
  pull_request:
    paths: [os/**, "!os/disk/**", crates/**, models/**, docs/WIDGETS.md, Cargo.toml, Cargo.lock, cosign.pub, .grype.yaml, .syft.yaml, .github/workflows/image.yml]
  push:
    branches: [main]
    paths: [os/**, "!os/disk/**", crates/**, models/**, docs/WIDGETS.md, Cargo.toml, Cargo.lock, cosign.pub, .grype.yaml, .syft.yaml, .github/workflows/image.yml]
  schedule:
    - cron: "0 4 * * *" # nightly, picks up Fedora security fixes
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tripppin

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # The image, its build stages and the scan's unpacked copy need more than
      # the runner's free space; drop preinstalled SDKs we never use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          # Headroom for the scans of a large image: the runner died of memory without it.
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          df -h /
          free -h

      - name: Build image
        run: sudo podman build -f os/Containerfile -t localhost/tripppin:ci .

      - name: Smoke test the image
        run: |
          sudo podman run --rm localhost/tripppin:ci trip --version
          sudo podman run --rm localhost/tripppin:ci bootc --version
          # Packages we removed for security reasons must stay removed.
          ! sudo podman run --rm localhost/tripppin:ci rpm -q toolbox
          # Branding: the logo command, the login banner and the system name.
          sudo podman run --rm localhost/tripppin:ci trip logo --static
          sudo podman run --rm localhost/tripppin:ci grep -q '█' /etc/issue
          sudo podman run --rm localhost/tripppin:ci grep -q '^NAME="Tripppin"' /usr/lib/os-release
          sudo podman run --rm localhost/tripppin:ci grep -q '^ID=fedora' /usr/lib/os-release
          # The model service: llama.cpp is present, knows the flags we pass, and the unit is enabled.
          sudo podman run --rm localhost/tripppin:ci llama-server --version
          sudo podman run --rm localhost/tripppin:ci sh -c 'llama-server --help | grep -q -- --sleep-idle-seconds'
          sudo podman run --rm localhost/tripppin:ci systemctl is-enabled tripppin-llm.service
          sudo podman run --rm localhost/tripppin:ci trip model list
          sudo podman run --rm localhost/tripppin:ci test -f /etc/profile.d/tripppin-shell.sh
          sudo podman run --rm localhost/tripppin:ci rpm -q NetworkManager-wifi wpa_supplicant iwlwifi-mvm-firmware
          sudo podman run --rm localhost/tripppin:ci flatpak remotes --system
          # GTK 4 apps abort at start without the OpenGL/EGL libraries (libepoxy loads them at runtime).
          sudo podman run --rm localhost/tripppin:ci sh -c 'ls /usr/lib*/libEGL.so.1 /usr/lib*/libGL.so.1 /usr/lib*/libGLESv2.so.2'
          sudo podman run --rm localhost/tripppin:ci sh -c 'systemctl is-enabled kmsconvt@tty1.service && fc-match "DM Mono" | grep -q DMMono'

      - name: Export image for scanning
        run: |
          sudo podman image prune -f
          sudo podman save --format docker-archive -o image.tar localhost/tripppin:ci
          sudo chmod 644 image.tar

      # Everything in the image comes from Fedora packages (plus our binaries), so the bill of
      # materials is the RPM database: walking every file (icon themes alone are tens of thousands)
      # took the runner down.
      - name: Bill of materials (SPDX)
        uses: anchore/sbom-action@v0
        env:
          SYFT_DEFAULT_CATALOGERS: rpm
          SYFT_PARALLELISM: "2"
        with:
          image: docker-archive:image.tar
          format: spdx-json
          output-file: tripppin-${{ matrix.arch }}.spdx.json
          upload-artifact: true

      - name: Vulnerability scan
        uses: anchore/scan-action@v6
        with:
          # Scan the bill of materials rather than cataloguing the whole image a second time.
          sbom: tripppin-${{ matrix.arch }}.spdx.json
          # Fail on critical issues that already have a fix: those mean we're shipping something stale.
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: table

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          rm -f image.tar
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push localhost/tripppin:ci "$IMAGE:${GITHUB_SHA::12}-${{ matrix.arch }}"

  publish:
    name: publish and sign
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Join both architectures under one tag
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sha="${GITHUB_SHA::12}"
          sudo podman manifest create tripppin-list
          for arch in amd64; do
            sudo podman manifest add tripppin-list "docker://$IMAGE:$sha-$arch"
          done
          sudo podman manifest push --all --digestfile digest tripppin-list "docker://$IMAGE:$sha"
          for arch in amd64; do
            sudo skopeo copy --all "docker://$IMAGE:$sha-$arch" "docker://$IMAGE:nightly-$arch"
          done
          sudo skopeo copy --all "docker://$IMAGE:$sha" "docker://$IMAGE:nightly"
          echo "DIGEST=$(cat digest)" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Signing the list with --recursive also signs each architecture's image.
          cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
          cosign verify --key cosign.pub "$IMAGE@$DIGEST" > /dev/null
          echo "signed and verified $IMAGE@$DIGEST"
