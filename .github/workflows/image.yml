name: image

on:
  pull_request:
    paths: [os/**, crates/**, models/**, Cargo.toml, Cargo.lock, cosign.pub, .grype.yaml, .syft.yaml, .github/workflows/image.yml]
  push:
    branches: [main]
    paths: [os/**, crates/**, models/**, Cargo.toml, Cargo.lock, cosign.pub, .grype.yaml, .syft.yaml, .github/workflows/image.yml]
  schedule:
    - cron: "0 4 * * *" # nightly, picks up Fedora security fixes
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tripppin

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: sudo podman build -f os/Containerfile -t localhost/tripppin:ci .

      - name: Smoke test the image
        run: |
          sudo podman run --rm localhost/tripppin:ci trip --version
          sudo podman run --rm localhost/tripppin:ci bootc --version
          # Packages we removed for security reasons must stay removed.
          ! sudo podman run --rm localhost/tripppin:ci rpm -q toolbox

      - name: Export image for scanning
        run: |
          sudo podman save --format docker-archive -o image.tar localhost/tripppin:ci
          sudo chmod 644 image.tar

      - name: Bill of materials (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: docker-archive:image.tar
          format: spdx-json
          output-file: tripppin-${{ matrix.arch }}.spdx.json
          upload-artifact: true

      - name: Vulnerability scan
        uses: anchore/scan-action@v6
        with:
          image: docker-archive:image.tar
          # Fail on critical issues that already have a fix: those mean we're shipping something stale.
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: table

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          rm -f image.tar
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push localhost/tripppin:ci "$IMAGE:${GITHUB_SHA::12}-${{ matrix.arch }}"

  publish:
    name: publish and sign
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Join both architectures under one tag
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sha="${GITHUB_SHA::12}"
          sudo podman manifest create tripppin-list
          for arch in amd64 arm64; do
            sudo podman manifest add tripppin-list "docker://$IMAGE:$sha-$arch"
          done
          sudo podman manifest push --all --digestfile digest tripppin-list "docker://$IMAGE:$sha"
          for arch in amd64 arm64; do
            sudo skopeo copy --all "docker://$IMAGE:$sha-$arch" "docker://$IMAGE:nightly-$arch"
          done
          sudo skopeo copy --all "docker://$IMAGE:$sha" "docker://$IMAGE:nightly"
          echo "DIGEST=$(cat digest)" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Signing the list with --recursive also signs each architecture's image.
          cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
          cosign verify --key cosign.pub "$IMAGE@$DIGEST" > /dev/null
          echo "signed and verified $IMAGE@$DIGEST"
