name: iso

# Builds the Alpine-based Tripppin ISO for x86_64 and aarch64 from alpine/ and the Rust
# crates, attaches it to the "nightly" pre-release and publishes it to Cloudflare R2 for the
# download button on trippp.in (latest.json points at the x86_64 ISO).
on:
  push:
    branches: [main]
    paths: [alpine/**, crates/**, models/**, Cargo.toml, Cargo.lock, .github/workflows/iso.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: iso (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      PODMAN_CONNECTION: local
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: sigstore/cosign-installer@v3
      - name: Build packages
        run: alpine/build-packages.sh ${{ matrix.arch }}
      - name: Build the ISO
        run: alpine/build-iso.sh ${{ matrix.arch }}
      - name: Checksums and signature
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          mkdir -p dist
          cp alpine/out/iso/${{ matrix.arch }}/*.iso dist/tripppin-${{ matrix.arch }}.iso
          cd dist
          sha256sum *.iso > SHA256SUMS-${{ matrix.arch }}
          cat SHA256SUMS-${{ matrix.arch }}
          [ -z "$COSIGN_PRIVATE_KEY" ] || cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
            --bundle SHA256SUMS-${{ matrix.arch }}.bundle SHA256SUMS-${{ matrix.arch }}
      - name: Attach to the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease --title "nightly" \
            --notes "Latest build of main. Not for daily use."
          for old in $(gh release view nightly --json assets --jq ".assets[].name | select(contains(\"${{ matrix.arch }}\"))"); do
            gh release delete-asset nightly "$old" --yes
          done
          gh release upload nightly dist/* --clobber
      - name: Publish to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: s3://tripppin-downloads
        run: |
          [ -n "$R2_ACCOUNT_ID" ] || { echo "no R2 credentials; skipping"; exit 0; }
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          aws configure set default.s3.multipart_chunksize 128MB
          aws configure set default.s3.max_concurrent_requests 4
          up(){ for try in 1 2 3; do aws s3 cp "$@" --endpoint-url "$endpoint" --only-show-errors && return 0; echo "upload failed (try $try), retrying"; sleep 15; done; return 1; }
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          cd dist
          a=${{ matrix.arch }}; iso=tripppin-$a.iso; day=$(date -u +%Y-%m-%d)
          up "$iso" "$BUCKET/releases/$day/$iso"
          up "$iso" "$BUCKET/latest/$iso"
          up "SHA256SUMS-$a" "$BUCKET/latest/SHA256SUMS-$a"
          [ ! -f "SHA256SUMS-$a.bundle" ] || up "SHA256SUMS-$a.bundle" "$BUCKET/latest/SHA256SUMS-$a.bundle"
          if [ "$a" = x86_64 ]; then
            size=$(stat -c %s "$iso"); sha=$(cut -d' ' -f1 "SHA256SUMS-$a")
            printf '{"version":"%s","date":"%s","file":"latest/%s","dated":"releases/%s/%s","bytes":%s,"sha256":"%s","commit":"%s"}\n' \
              "$day" "$day" "$iso" "$day" "$iso" "$size" "$sha" "${GITHUB_SHA::12}" > latest.json
            up latest.json "$BUCKET/latest.json" --content-type application/json
            cat latest.json
          fi
