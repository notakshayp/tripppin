name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 5 * * 1" # weekly: catch newly published advisories

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # The default members: everything but tripppin-ui, which needs Fedora's GTK (below).
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Run trip hw on the runner
        run: cargo run --locked -q -p trip -- hw

  ui:
    name: desktop screens (fedora)
    runs-on: ubuntu-24.04
    container: quay.io/fedora/fedora:45
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and GTK
        run: dnf -y install --setopt=install_weak_deps=False cargo rust gcc clippy rustfmt gtk4-devel gtk4-layer-shell-devel
      - name: Lint
        run: cargo clippy -p tripppin-ui --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p tripppin-ui --locked

  deny:
    name: vulnerabilities and licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
